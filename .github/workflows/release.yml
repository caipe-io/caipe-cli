name: Publish caipe CLI

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "caipe/v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#caipe/}"
          release_version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "$release_version" || {
            echo "package.json version $package_version does not match tag $release_version" >&2
            exit 1
          }

      - name: Type check
        run: bun tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test release launcher
        run: bun run test:e2e

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-14
            artifact: caipe-darwin-arm64
          - target: bun-darwin-x64
            os: macos-15-intel
            artifact: caipe-darwin-x64
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
            artifact: caipe-linux-arm64
          - target: bun-linux-x64
            os: ubuntu-24.04
            artifact: caipe-linux-x64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile single-file binary
        run: |
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile=dist/${{ matrix.artifact }} \
            --external keytar \
            --external fsevents
          chmod +x dist/${{ matrix.artifact }}

      - name: Ad-hoc sign binary
        if: runner.os == 'macOS'
        run: |
          codesign --remove-signature "dist/${{ matrix.artifact }}" 2>/dev/null || true
          codesign --sign - --force \
            --entitlements entitlements.plist \
            "dist/${{ matrix.artifact }}"

      - name: Smoke test binary
        run: dist/${{ matrix.artifact }} --version

      - name: Compute SHA-256 checksum
        working-directory: dist
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate tag and extract version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#caipe/}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Merge checksums
        run: |
          find dist -type f -name '*.sha256' -print0 \
            | sort -z \
            | xargs -0 cat > dist/caipe-checksums.txt
          test "$(wc -l < dist/caipe-checksums.txt)" -eq 4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: caipe CLI v${{ steps.version.outputs.version }}
          body: |
            ## Install

            Published npm package (automatic platform selection):

            ```bash
            npm install -g caipe@${{ steps.version.outputs.version }}
            caipe --version
            ```

            Direct binary installer:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/cnoe-io/caipe-cli/main/install.sh | sh
            ```

            Verify downloaded assets with `sha256sum -c caipe-checksums.txt`.
          files: |
            dist/caipe-darwin-arm64
            dist/caipe-darwin-x64
            dist/caipe-linux-arm64
            dist/caipe-linux-x64
            dist/caipe-checksums.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true

  sign:
    name: Sign binaries with cosign
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Sign binaries
        env:
          COSIGN_YES: "true"
        run: |
          for artifact in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            cosign sign-blob "dist/${artifact}" \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem"
          done

      - name: Upload signatures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for artifact in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            gh release upload "$TAG" \
              "${artifact}.sig" \
              "${artifact}.pem" \
              --repo "$REPO" \
              --clobber
          done

  publish-npm:
    name: Publish npm packages
    needs: [release, sign]
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: release-*
          path: binaries
          merge-multiple: true

      - name: Prepare platform packages
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for package in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            mkdir -p "npm/${package}/bin"
            cp "binaries/${package}" "npm/${package}/bin/caipe"
            chmod +x "npm/${package}/bin/caipe"
            npm version "$VERSION" --no-git-tag-version --prefix "npm/${package}"
            npm pkg set "optionalDependencies.${package}=${VERSION}"
          done
          npm version "$VERSION" --no-git-tag-version

      - name: Verify npm package contents
        run: |
          for package in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            npm pack --dry-run "./npm/${package}"
          done
          npm pack --dry-run

      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$NPM_CONFIG_USERCONFIG"

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          npm_tag=latest
          if [[ "$VERSION" == *-* ]]; then npm_tag=next; fi
          for package in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            npm publish "./npm/${package}" --access public --tag "$npm_tag" --provenance
          done

      - name: Publish caipe package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          npm_tag=latest
          if [[ "$VERSION" == *-* ]]; then npm_tag=next; fi
          npm publish --access public --tag "$npm_tag" --provenance
