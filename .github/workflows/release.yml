name: Publish caipe CLI

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "caipe/v[0-9]*.[0-9]*.[0-9]*"
  workflow_run:
    workflows:
      - caipe CLI CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Serialize main releases so simultaneous merges cannot select the same patch.
  group: publish-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release tag
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          normalize_tag() {
            local value="${1#caipe/}"
            printf '%s\n' "${value#v}"
          }

          if [[ "$RELEASE_EVENT" != "workflow_run" ]]; then
            tag="$GITHUB_REF_NAME"
            version="$(normalize_tag "$tag")"
          else
            existing_tag="$({
              git tag --points-at "$MAIN_SHA" \
                | grep -E '^(caipe/)?v?[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1
            } || true)"

            if [[ -n "$existing_tag" ]]; then
              tag="$existing_tag"
              version="$(normalize_tag "$tag")"
              echo "Reusing $tag already attached to $MAIN_SHA"
            else
              package_version="$(node -p "require('./package.json').version")"
              if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "package.json must contain a stable semantic version: $package_version" >&2
                exit 1
              fi

              latest_version="$({
                git tag --list \
                  | sed -En 's#^(caipe/)?v?([0-9]+\.[0-9]+\.[0-9]+)$#\2#p' \
                  | sort -V \
                  | tail -n 1
              } || true)"

              if [[ -z "$latest_version" ]]; then
                version="$package_version"
              else
                highest_version="$(printf '%s\n%s\n' "$latest_version" "$package_version" | sort -V | tail -n 1)"
                if [[ "$highest_version" == "$package_version" && "$package_version" != "$latest_version" ]]; then
                  version="$package_version"
                else
                  IFS=. read -r major minor patch <<< "$latest_version"
                  version="${major}.${minor}.$((patch + 1))"
                fi
              fi

              tag="$version"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag --annotate "$tag" "$MAIN_SHA" --message "caipe CLI $tag"
              git push origin "refs/tags/$tag"
              echo "Created $tag for $MAIN_SHA"
            fi
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release source
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Type check
        run: bun tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test release launcher
        run: bun run test:e2e

  build:
    name: Build ${{ matrix.artifact }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-14
            artifact: caipe-darwin-arm64
          - target: bun-darwin-x64
            os: macos-15-intel
            artifact: caipe-darwin-x64
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
            artifact: caipe-linux-arm64
          - target: bun-linux-x64
            os: ubuntu-24.04
            artifact: caipe-linux-x64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Compile single-file binary
        run: |
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile=dist/${{ matrix.artifact }} \
            --external keytar \
            --external fsevents
          chmod +x dist/${{ matrix.artifact }}

      - name: Ad-hoc sign binary
        if: runner.os == 'macOS'
        run: |
          codesign --remove-signature "dist/${{ matrix.artifact }}" 2>/dev/null || true
          codesign --sign - --force \
            --entitlements entitlements.plist \
            "dist/${{ matrix.artifact }}"

      - name: Smoke test binary
        run: dist/${{ matrix.artifact }} --version

      - name: Compute SHA-256 checksum
        working-directory: dist
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Merge checksums
        run: |
          find dist -type f -name '*.sha256' -print0 \
            | sort -z \
            | xargs -0 cat > dist/caipe-checksums.txt
          test "$(wc -l < dist/caipe-checksums.txt)" -eq 4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: caipe CLI v${{ needs.prepare.outputs.version }}
          body: |
            ## Install

            Published npm package (automatic platform selection):

            ```bash
            npm install -g caipe@${{ needs.prepare.outputs.version }}
            caipe --version
            ```

            Direct binary installer:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/cnoe-io/caipe-cli/main/install.sh | sh
            ```

            Verify downloaded assets with `sha256sum -c caipe-checksums.txt`.
          files: |
            dist/caipe-darwin-arm64
            dist/caipe-darwin-x64
            dist/caipe-linux-arm64
            dist/caipe-linux-x64
            dist/caipe-checksums.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true

  sign:
    name: Sign binaries with cosign
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Sign binaries
        env:
          COSIGN_YES: "true"
        run: |
          for artifact in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            cosign sign-blob "dist/${artifact}" \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem"
          done

      - name: Upload signatures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          for artifact in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            gh release upload "$TAG" \
              "${artifact}.sig" \
              "${artifact}.pem" \
              --repo "$REPO" \
              --clobber
          done

  publish-npm:
    name: Publish npm packages
    needs: [release, sign]
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: release-*
          path: binaries
          merge-multiple: true

      - name: Prepare platform packages
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for package in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            mkdir -p "npm/${package}/bin"
            cp "binaries/${package}" "npm/${package}/bin/caipe"
            chmod +x "npm/${package}/bin/caipe"
            npm version "$VERSION" --no-git-tag-version --prefix "npm/${package}"
            npm pkg set "optionalDependencies.${package}=${VERSION}"
          done
          npm version "$VERSION" --no-git-tag-version

      - name: Verify npm package contents
        run: |
          for package in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            npm pack --dry-run "./npm/${package}"
          done
          npm pack --dry-run

      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$NPM_CONFIG_USERCONFIG"

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          npm_tag=latest
          if [[ "$VERSION" == *-* ]]; then npm_tag=next; fi
          for package in caipe-darwin-arm64 caipe-darwin-x64 caipe-linux-arm64 caipe-linux-x64; do
            npm publish "./npm/${package}" --access public --tag "$npm_tag" --provenance
          done

      - name: Publish caipe package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          npm_tag=latest
          if [[ "$VERSION" == *-* ]]; then npm_tag=next; fi
          npm publish --access public --tag "$npm_tag" --provenance
